services:
  - type: web
    name: vatictrader
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vatictrader-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: ENCRYPTION_KEY
        generateValue: true

databases:
  - name: vatictrader-db
    plan: free
    databaseName: vatictrader
    user: vatictrader
